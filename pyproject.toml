[project]
name = "ishop-workspace"
version = "0.1.0"
description = "Drake — Voice shopping assistant workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[websocket]>=1.3.0,<1.4.0",
    "websockets>=15.0,<16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv.workspace]
members = [
    "services/runtime",
]

[tool.pytest.ini_options]
pythonpath = ["services/runtime/src", "."]
testpaths = ["services/runtime/tests", "tests", "evals/tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "docs/research/archive",
    "docs/research/sources",
    "data/private",
    "evals/private",
    "artifacts/private",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
