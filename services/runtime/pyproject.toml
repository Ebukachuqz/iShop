[project]
name = "ishop-runtime"
version = "0.1.0"
description = "FastAPI and Pipecat voice runtime for iShop (Drake)"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[websocket]>=1.3.0,<1.4.0",
    "websockets>=15.0,<16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
